<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>学习卡</title>
<link rel="stylesheet" href="../shell/card.css">
<style>
  /* project rail */
  .srail { display: flex; gap: 4px; padding: 8px 8px 0; flex: 0 0 auto; overflow-x: auto; }
  .srail::-webkit-scrollbar { height: 0; }
  .pchip {
    appearance: none; border: 1px solid var(--surf-hi); background: var(--surf);
    color: var(--ink-3); font: 600 0.808rem/1 "Microsoft YaHei", sans-serif;
    padding: 6px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; flex: 0 0 auto;
  }
  .pchip.on { background: rgba(244,123,92,.18); color: #ffb9a6; border-color: rgba(244,123,92,.4); }
  .pchip.add { color: var(--ink-4); }
  .pchip.add:hover { color: #fff; }
  .sbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px 0; flex: 0 0 auto; }
  .sbar .pname { flex: 1; min-width: 0; font-size: 0.923rem; font-weight: 700; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sbar .kindtag { font-size: 0.731rem; color: #f47b5c; border: 1px solid rgba(244,123,92,.35); border-radius: 5px; padding: 1px 6px; flex: 0 0 auto; }
  .sbar button {
    appearance: none; border: none; background: var(--surf); color: var(--ink-3);
    font-size: 0.808rem; border-radius: 6px; padding: 4px 8px; cursor: pointer; flex: 0 0 auto;
  }
  .sbar button:hover { background: var(--surf-hi); color: #fff; }

  .spane { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px 14px; }
  .spane::-webkit-scrollbar { width: 5px; }
  .spane::-webkit-scrollbar-thumb { background: var(--surf-max); border-radius: 3px; }

  .sform { display: flex; gap: 5px; margin: 8px 0 10px; flex-wrap: wrap; }
  .sform input, .sform select {
    background: var(--surf); border: 1px solid var(--surf-hi); border-radius: 7px;
    color: var(--ink); padding: 6px 8px; font-size: 0.846rem; min-width: 0;
  }
  .sform input { flex: 1; }
  .sform button {
    appearance: none; border: 1px solid rgba(244,123,92,.4); border-radius: 7px;
    background: rgba(244,123,92,.15); color: #ffb9a6; font: 600 0.846rem/1 "Microsoft YaHei", sans-serif;
    padding: 7px 12px; cursor: pointer; flex: 0 0 auto;
  }
  .sform button:hover { background: rgba(244,123,92,.3); color: #fff; }

  .vmeta { display: flex; justify-content: space-between; align-items: center; font-size: 0.808rem; color: var(--ink-4); margin-bottom: 8px; gap: 0.3rem; }
  .vmeta label { display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
  .vmodes { display: flex; align-items: center; gap: 0.3rem; }
  .mbtn {
    appearance: none; border: 1px solid var(--surf-hi); background: var(--surf); color: var(--ink-3);
    font-size: 0.73rem; border-radius: 0.4rem; padding: 0.15rem 0.45rem; cursor: pointer; white-space: nowrap;
  }
  .mbtn:hover { background: var(--surf-hi); color: #fff; }
  /* 4-choice (Baicizhan) mode */
  .vopts { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: 0.35rem; margin-top: 0.55rem; }
  .vopt {
    display: flex; align-items: center; gap: 0.4rem; text-align: left; min-width: 0;
    appearance: none; border: 1px solid var(--surf-hi); border-radius: 0.6rem;
    background: var(--surf); color: var(--ink-2); cursor: pointer;
    font-size: 0.85rem; line-height: 1.45; padding: 0.5rem 0.55rem;
    transition: border-color .15s, background .15s, opacity .15s;
  }
  .vopt:hover { background: var(--surf-hi); border-color: var(--accent); }
  .vopt .vk {
    flex: 0 0 auto; width: 1.05rem; height: 1.05rem; border-radius: 0.3rem;
    background: var(--surf-max); color: var(--ink-3); font-size: 0.69rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .vopt .vt { flex: 1; min-width: 0; }
  .vopt.ok { border-color: rgba(158,206,106,.65); background: rgba(158,206,106,.14); color: #b2d98a; }
  .vopt.no { border-color: rgba(224,108,91,.65); background: rgba(224,108,91,.14); color: #e89a8c; }
  .vopt.dim { opacity: .45; }
  .vfb { font-size: 0.81rem; font-weight: 700; margin-top: 0.45rem; }
  .vfb.ok { color: #b2d98a; }
  .vfb.no { color: #e89a8c; }
  .flash {
    min-height: clamp(84px, 30%, 140px); border-radius: 14px; cursor: pointer;
    background: var(--surf); border: 1px solid var(--surf-hi);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 16px; text-align: center; transition: transform .18s ease;
    user-select: text; -webkit-user-select: text;
  }
  .flash:active { transform: scale(.985); }
  .flash .fw { font-size: clamp(1.3rem, 2.2vw + 0.85rem, 1.77rem); font-weight: 800; }
  .flash .fm { font-size: 1rem; color: var(--ink-2); line-height: 1.7; }
  .flash .fhint { font-size: 0.769rem; color: var(--ink-4); }
  .vacts { display: flex; gap: 5px; margin-top: 9px; }
  .vacts button {
    flex: 1; appearance: none; border: 1px solid var(--surf-hi); border-radius: 8px;
    background: var(--surf); color: var(--ink-3); font: 600 0.808rem/1 "Microsoft YaHei", sans-serif;
    padding: 8px 0; cursor: pointer;
  }
  .vacts button:hover { background: var(--surf-hi); color: #fff; }
  .vacts .know { border-color: rgba(158,206,106,.4); color: #b2d98a; }
  .vacts .dunno { border-color: rgba(224,108,91,.4); color: #e89a8c; }

  .litem { display: flex; align-items: center; gap: 7px; padding: 8px 9px; margin-bottom: 6px;
    background: var(--surf); border: 1px solid var(--surf-hi); border-radius: 9px; }
  .litem .lt { flex: 1; min-width: 0; font-size: 0.885rem; }
  .litem .lt small { display: block; color: var(--ink-4); font-size: 0.731rem; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .litem button {
    appearance: none; border: 1px solid var(--surf-hi); border-radius: 6px;
    background: var(--surf); color: var(--ink-3); font-size: 0.769rem; padding: 4px 8px; cursor: pointer; flex: 0 0 auto;
  }
  .litem button:hover { color: #fff; background: var(--surf-hi); }
  .litem button.on { border-color: rgba(244,123,92,.5); color: #ffb9a6; }
  .litem .del { color: var(--ink-4); }
  .litem .del:hover { color: #e89a8c; background: rgba(224,108,91,.15); }

  .qcard {
    background: var(--surf); border: 1px solid var(--surf-hi); border-radius: 12px;
    padding: 14px; font-size: 0.962rem; line-height: 1.8; margin-bottom: 10px;
    user-select: text; -webkit-user-select: text;
  }
  .qcard .tag { font-size: 0.769rem; color: #f47b5c; letter-spacing: .06em; margin-bottom: 6px; }
  .qcard .cn { font-size: 0.846rem; color: var(--ink-3); margin-top: 6px; }
  .qlist .qitem {
    font-size: 0.885rem; color: var(--ink-3); line-height: 1.7; padding: 8px 10px;
    border-left: 2px solid rgba(244,123,92,.35); margin-bottom: 6px; border-radius: 0 8px 8px 0;
    background: var(--surf); cursor: pointer; user-select: text; -webkit-user-select: text;
    display: flex; gap: 7px; align-items: baseline;
  }
  .qlist .qitem:hover { background: var(--surf-hi); }
  .qlist .qitem .qt { flex: 1; min-width: 0; }
  .qlist .qitem.done { opacity: .45; }
  .qlist .qitem.done .qt { text-decoration: line-through; }
  .qlist .qitem .mini { flex: 0 0 auto; font-size: 0.731rem; color: var(--ink-4); }
  .qlist .qitem .mini:hover { color: #e89a8c; }

  .cats { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
  .cats .cat {
    font-size: 0.769rem; padding: 3px 9px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--surf-hi); color: var(--ink-3); background: var(--surf);
  }
  .cats .cat.on { color: #fff; }
  .cats .catadd { color: var(--ink-4); border-style: dashed; }
  .nitem { padding: 8px 10px; margin-bottom: 6px; border-radius: 9px;
    background: var(--surf); border: 1px solid var(--surf-hi); }
  .nitem .nt { font-size: 0.885rem; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  .nitem .nt .del { font-weight: 400; color: var(--ink-4); cursor: pointer; flex: 0 0 auto; }
  .nitem .nt .del:hover { color: #e89a8c; }
  .nitem .nb { font-size: 0.846rem; color: var(--ink-3); line-height: 1.7; margin-top: 3px;
    cursor: pointer; user-select: text; -webkit-user-select: text; white-space: pre-wrap; word-break: break-all; }
  .nitem .nb:hover { color: #fff; }
  .nitem .nb::after { content: ' ⧉'; color: var(--ink-4); font-size: 0.692rem; }
  .empty { color: var(--ink-4); font-size: 0.885rem; text-align: center; padding: 26px 0; }
  .ptip { font-size: 0.731rem; color: var(--ink-4); text-align: center; padding: 4px 0 8px; }
</style>
</head>
<body class="theme-light">
<div id="card">
  <div id="chrome-slot"></div>
  <div class="srail" id="srail"></div>
  <div class="sbar" id="sbar"></div>
  <div class="spane" id="spane"></div>
  <div id="rslot"></div>
</div>
<script src="../shell/card.js"></script>
<script src="study.js"></script>
</body>
</html>
