<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pico RamOS taskbar skin (RETIRED - not loaded)</title>
<style>
/* A skin, not a second taskbar: the native Windows taskbar stays visible and
   fully clickable underneath. This window is transparent and entirely
   click-through, so every icon, tray button and start button still belongs to
   Windows. The blocks only paint glass over them. */
:root {
  --tb-tint: rgba(120, 150, 150, .16);
  --tb-tint-strong: rgba(120, 150, 150, .26);
  --tb-edge: rgba(255, 255, 255, .24);
  --tb-accent: rgba(120, 190, 210, .95);
  --tb-fg: rgba(240, 246, 247, .96);
  --tb-blur: 12px;
  --tb-sat: 115%;
  --tb-h: 48px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%;
  background: transparent; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
#skin {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 0 10px;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 2.5%, #000 97.5%, transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 2.5%, #000 97.5%, transparent 100%);
}
.tb-block {
  position: relative;
  flex: 1 1 0; min-width: 0;
  height: calc(var(--tb-h) - 10px);
  border-radius: 10px;
  overflow: hidden;
  background: var(--tb-tint);
  border: 1px solid var(--tb-edge);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .20),
              0 2px 10px rgba(6, 18, 22, .16);
  -webkit-backdrop-filter: blur(var(--tb-blur)) saturate(var(--tb-sat));
  backdrop-filter: blur(var(--tb-blur)) saturate(var(--tb-sat));
  transition: background .45s ease, border-color .45s ease;
}
.tb-block > i {
  position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none;
}

/* 1 / 3 liquid: hairline rim + diagonal sheen */
.tb-block.glass-liquid {
  background:
    linear-gradient(150deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, 0) 48%),
    var(--tb-tint);
}
.tb-block.glass-liquid > i {
  background:
    linear-gradient(150deg, rgba(255, 255, 255, .26) 0%, rgba(255, 255, 255, 0) 34%),
    radial-gradient(130% 80% at 12% 0%, rgba(255, 255, 255, .16), transparent 62%);
  mix-blend-mode: screen;
}

/* 2 / 3 fluted (长虹玻璃): vertical reeds, crest + groove + cylindrical bow */
.tb-block.glass-fluted > i {
  background-image: repeating-linear-gradient(
    90deg,
    rgba(255, 255, 255, 0) 0px,
    rgba(255, 255, 255, .42) 2px,
    rgba(255, 255, 255, .04) 5px,
    rgba(0, 0, 0, .18) 9px,
    rgba(255, 255, 255, 0) 14px
  );
  background-size: 14px 100%;
  mix-blend-mode: overlay;
  filter: blur(.5px);
  opacity: .85;
}
.tb-block.glass-fluted > i::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, 0) 40%, rgba(0, 0, 0, .10));
  mix-blend-mode: multiply;
  opacity: .5;
}

/* 3 / 3 frosted: even matte, no ribs */
.tb-block.glass-frosted {
  background: var(--tb-tint-strong);
  -webkit-backdrop-filter: blur(calc(var(--tb-blur) * 1.4)) saturate(105%) brightness(1.02);
  backdrop-filter: blur(calc(var(--tb-blur) * 1.4)) saturate(105%) brightness(1.02);
}
.tb-block.glass-frosted > i {
  background: radial-gradient(120% 90% at 50% -20%, rgba(255, 255, 255, .12), transparent 70%);
}

body.on-dark .tb-block { border-color: rgba(255, 255, 255, .16); }
body.on-dark .tb-block.glass-frosted { background: var(--tb-tint); }
</style>
</head>
<body>
  <div id="skin"></div>
  <script src="taskbar-skin.js"></script>
</body>
</html>
